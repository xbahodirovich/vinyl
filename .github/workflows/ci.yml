name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Publication safety checks
        run: python3 Scripts/check-publication.py
      - name: Secret scan (pinned, checksum verified)
        run: Scripts/scan-secrets.sh
      - name: Swift tests
        run: swift test --disable-sandbox
      - name: Browser bridge tests
        run: node Scripts/test-browser.mjs
      - name: Build app
        run: Scripts/build.sh
